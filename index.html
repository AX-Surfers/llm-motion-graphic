<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 원리 모션그래픽 · SURFERS</title>
<meta name="description" content="서퍼스 AI 원리 모션그래픽 — LLM, Jev 등 AI 개념을 한 동작씩 넘겨 보는 설명 애니메이션">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // 예전 주소(루트에 ?v=… 나 #스텝)로 들어오면 LLM 원리로 보낸다
  if (/[?&]v=/.test(location.search) || /^#\d+$/.test(location.hash)) location.replace('llm/' + location.search + location.hash);
</script>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color: #ccc;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 34px; min-height: 100vh; padding: 48px 0; box-sizing: border-box; }
  .brand { height: clamp(26px, 3vw, 38px); margin-bottom: -6px; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 54px); color: #fff; font-weight: 800; letter-spacing: -0.02em; text-align: center; }
  p.sub { margin: -18px 0 0; color: #8c8c8c; font-family: "Times New Roman", serif; font-style: italic; font-size: clamp(15px, 1.6vw, 22px); }
  .cards { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .card { box-sizing: border-box; display: block; text-decoration: none; width: min(380px, 86vw); padding: 26px 28px; border-radius: 18px; border: 1.5px solid #333; background: #0e0e0e; transition: border-color .2s, transform .2s, background .2s; }
  .card:hover, .card:focus-visible { border-color: var(--c); background: #151515; transform: translateY(-3px); outline: none; }
  .card .tag { display: inline-block; font-size: 13px; font-weight: 700; color: #000; background: var(--c); border-radius: 5px; padding: 2px 9px; }
  .card h2 { margin: 14px 0 8px; font-size: 26px; color: #fff; }
  .card p { margin: 0; color: #bdbdbd; font-size: 15.5px; line-height: 1.6; }
  .card .meta { margin-top: 16px; color: #6e6e6e; font-size: 13.5px; }
  kbd { display: inline-block; min-width: 1.4em; padding: 1px 6px; border: 1px solid #444; border-bottom-width: 2px; border-radius: 5px; background: #1a1a1a; color: #ddd; font: 600 12px/1.5 ui-monospace, Menlo, monospace; text-align: center; }
  .hint { color: #5e5e5e; font-size: 13px; }
</style>
</head>
<body>
  <img class="brand" src="brand/surfers-logo.svg" alt="SURFERS">
  <h1>AI 원리 모션그래픽</h1>
  <p class="sub">Step-by-step explainers</p>
  <div class="cards">
    <a class="card" href="llm/" style="--c:#58C4DD">
      <span class="tag">LLM 원리</span>
      <h2>LLM은 어떻게 말을 할까?</h2>
      <p>다음 단어 예측과 확률, 파라미터와 학습, RLHF, 트랜스포머와 어텐션까지.</p>
      <div class="meta"><kbd>1</kbd> 초보자 · 기본 버전</div>
    </a>
    <a class="card" href="jev/" style="--c:#FFD84D">
      <span class="tag">Jev (TypeSafe)</span>
      <h2>Jev는 어떻게 판단할까?</h2>
      <p>글 대신 정해진 칸에 답하는 System One 모델. 질문 도구, 신뢰도, 보정, 쓰임새까지.</p>
      <div class="meta"><kbd>2</kbd> 쉬운 · 공학 버전</div>
    </a>
  </div>
  <div class="hint">발표 화면에서는 → / ← 로 한 동작씩 넘겨요</div>
<script>
  const links = [...document.querySelectorAll('.card')];
  addEventListener('keydown', (e) => { const i = +e.key - 1; if (links[i]) location.href = links[i].href; });
</script>
</body>
</html>
